name: PR checks

on:
  pull_request:
    branches: [main]

# Cancel a superseded run from an older push to the same PR, so CI minutes aren't spent
# testing a commit nobody cares about anymore.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-and-typecheck-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/catalog/pyproject.toml
            packages/db/pyproject.toml
            apps/api/pyproject.toml
            workers/pyproject.toml
            infra/pyproject.toml
      - name: Install Python packages (editable, dev extras)
        run: |
          pip install -e "packages/catalog[dev]" -e "packages/db[dev]" \
            -e "apps/api[dev]" -e "workers[dev]" -e "infra[dev]"
      - name: ruff + mypy
        run: |
          cd packages/catalog && ruff check . && mypy src && cd -
          cd packages/db && ruff check . && mypy src && cd -
          cd apps/api && ruff check . && mypy app && cd -
          cd workers && ruff check . && mypy core ops && cd -
          cd infra && ruff check . && mypy stacks app.py

  unit-tests-python:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck-python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/catalog/pyproject.toml
            packages/db/pyproject.toml
            apps/api/pyproject.toml
            workers/pyproject.toml
            infra/pyproject.toml
      - name: Install Python packages (editable, dev extras)
        run: |
          pip install -e "packages/catalog[dev]" -e "packages/db[dev]" \
            -e "apps/api[dev]" -e "workers[dev]" -e "infra[dev]"
      - name: pytest (catalog, db, api, workers, infra)
        run: |
          cd packages/catalog && python -m pytest && cd -
          cd packages/db && python -m pytest && cd -
          cd apps/api && python -m pytest && cd -
          cd workers && python -m pytest && cd -
          cd infra && python -m pytest

  lint-typecheck-and-unit-test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run format --prefix apps/web
      - run: npm run build --prefix apps/web # tsc -b && vite build
      - run: npm run test --prefix apps/web

  playwright-against-msw:
    runs-on: ubuntu-latest
    needs: lint-typecheck-and-unit-test-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Install Playwright OS deps only (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e --prefix apps/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  lighthouse-budgets:
    runs-on: ubuntu-latest
    needs: lint-typecheck-and-unit-test-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lhci --prefix apps/web

  cdk-diff-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: infra/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g aws-cdk
      - run: pip install -e "infra[dev]"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.MF_DEV_AWS_ACCOUNT_ID }}:role/modelforge-plan-dev
          aws-region: us-east-1
      - name: cdk diff (dev) — read-only, never a deploy
        working-directory: infra
        run: cdk diff -c env=dev --all > /tmp/cdk-diff.txt 2>&1 || true
      - name: Post diff as a PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const fs = require('fs')
            const diff = fs.readFileSync('/tmp/cdk-diff.txt', 'utf8').slice(0, 60000)
            const body = `### \`cdk diff\` against dev\n\n<details><summary>Show diff</summary>\n\n\`\`\`\n${diff}\n\`\`\`\n\n</details>`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.startsWith('### `cdk diff` against dev'))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
