name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e packages/catalog[dev] -e apps/api[dev] -e workers[dev]
      - run: npm ci --prefix apps/web
      - run: |
          cd packages/catalog && ruff check . && mypy src
          cd ../../apps/api && ruff check . && mypy app
          cd ../../workers && ruff check . && mypy core ops
      - run: npm run lint --prefix apps/web

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e packages/catalog[dev] -e apps/api[dev] -e workers[dev]
      - run: npm ci --prefix apps/web
      - run: |
          cd packages/catalog && python -m pytest
          cd ../../apps/api && python -m pytest
          cd ../../workers && python -m pytest
      - run: npm run test --prefix apps/web
