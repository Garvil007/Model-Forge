name: Nightly E2E smoke (dev)

# Re-runs the existing Playwright suite (apps/web/e2e) against the deployed dev environment
# instead of the local preview build used by pr.yml's `playwright-against-msw` job. This is a
# smoke test for "did last night's dev deploy break something end to end" — it does not add
# new tests and does not touch the PR-triggered run.
on:
  schedule:
    # 03:00 UTC nightly. No particular significance to the hour beyond "low-traffic, after
    # any end-of-day deploys have landed."
    - cron: "0 3 * * *"
  workflow_dispatch: {} # allow running on demand from the Actions tab

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  playwright-against-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Install Playwright OS deps only (browsers cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: apps/web
      - name: Run Playwright suite against the dev deployment
        run: npm run test:e2e --prefix apps/web
        env:
          # Set as a variable (not secret) on the "dev" GitHub Environment — it's a public
          # CloudFront URL, not sensitive. See deploy.yml's `frontend` job for where dev's
          # URL comes from.
          PLAYWRIGHT_BASE_URL: ${{ vars.MF_DEV_BASE_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-nightly-dev
          path: apps/web/playwright-report/
          retention-days: 7
