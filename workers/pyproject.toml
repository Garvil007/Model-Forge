[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-workers"
version = "0.1.0"
description = "ModelForge job runners: the Python workers that compress/convert models"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "h5py>=3.11",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxconverter-common>=1.14",
    "safetensors>=0.4",
    "huggingface-hub>=0.25",
    "pillow>=10.0",
    "transformers>=4.40",
    "pycocotools>=2.0.7",
]
# modelforge-catalog and modelforge-db aren't on PyPI: install them editable alongside
# this package (see Makefile / CI, which run
# `pip install -e packages/catalog -e packages/db -e workers`).
# torch and tensorflow are deliberately NOT base dependencies — `workers/ops/detect.py`'s
# module docstring explains why detection never unpickles. The ops that actually run a
# compression/conversion job on a trusted, already-detected model file need the real
# framework though, so those live behind the `torch-ops`/`tf-ops` extras below, matching
# the cpu-torch/cpu-tf images in `workers/images/`: each format's caster imports its
# framework lazily, so an op module still imports fine on whichever image lacks the other.

[project.optional-dependencies]
dev = [
    "pytest>=8", "ruff>=0.6", "mypy>=1.11",
    "modelforge-workers[torch-ops,tf-ops,convert-ops,llm-ops,gpu-ops]",
]
torch-ops = ["torch>=2.2"]
tf-ops = ["tensorflow-cpu>=2.16; sys_platform != 'darwin'", "tensorflow>=2.16; sys_platform == 'darwin'"]
# The Convert tab (`convert_*.py`) needs both torch-ops and tf-ops plus format-conversion
# libraries no other op uses: onnx2tf (onnx->tflite/savedmodel), onnx2torch (onnx->
# torchscript), tf2onnx (keras->onnx, via its CLI — see convert_onnx.py's docstring for
# why the Python API doesn't work against Keras 3), openvino + nncf (onnx/keras/yolo/HF->
# OpenVINO IR, including calibration-free INT8 weight compression), optimum[onnxruntime]
# (HF safetensors -> ONNX), and ultralytics (any YOLO source/target).
convert-ops = [
    "onnx2tf>=2.6",
    "onnx2torch>=1.5",
    "tf2onnx>=1.17",
    "openvino>=2026.0",
    "nncf>=3.4",
    "optimum[onnxruntime]>=2.1",
    "ultralytics>=8.4",
    # onnx2tf's SavedModel output needs its "tf_converter" backend, which needs this
    # optional Keras-2-compat package even though the rest of this image is Keras 3.
    "tf_keras>=2.21",
]
# q_gguf/c_gguf (workers/ops/quantize_gguf.py, convert_gguf.py): llama.cpp's own
# convert_hf_to_gguf.py needs torch + sentencepiece + protobuf + the gguf package to
# read an HF repo's weights generically; the llama.cpp binaries themselves (llama-
# quantize/llama-imatrix/llama-perplexity) are not pip-installable and come from the
# cpu-llm image's own build step instead (workers/images/cpu-llm/Dockerfile).
llm-ops = ["torch>=2.2", "sentencepiece>=0.2", "protobuf>=4.25", "gguf>=0.10"]
# q_gptq/q_awq/q_nf4 (workers/ops/quantize_gptq.py, quantize_awq.py, quantize_nf4.py):
# llm-compressor (GPTQ/AWQ), bitsandbytes (NF4), accelerate (device_map), datasets
# (WikiText-2/C4 calibration). Installable and testable on CPU (MF_LLM_DEVICE=cpu) even
# though the real gpu-base image runs these on CUDA — see _llm_gpu_common.py.
gpu-ops = ["torch>=2.2", "llmcompressor>=0.3", "bitsandbytes>=0.45", "accelerate>=1.0", "datasets>=2.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
