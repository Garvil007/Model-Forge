[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-workers"
version = "0.1.0"
description = "ModelForge job runners: the Python workers that compress/convert models"
requires-python = ">=3.11"
dependencies = []
# modelforge-catalog isn't on PyPI: install it editable alongside this package
# (see Makefile / CI, which run `pip install -e packages/catalog -e workers`).

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
