[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-api"
version = "0.1.0"
description = "ModelForge FastAPI backend (Lambda via Mangum, DynamoDB for state)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "mangum>=0.17",
]
# modelforge-catalog isn't on PyPI: install it editable alongside this package
# (see Makefile / CI, which run `pip install -e packages/catalog -e apps/api`).

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn[standard]>=0.30", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
