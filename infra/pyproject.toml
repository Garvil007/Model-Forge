[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-infra"
version = "0.1.0"
description = "ModelForge AWS CDK app (infrastructure as code)"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.160",
    "constructs>=10.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "boto3-stubs[ssm]>=1.34"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stacks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
