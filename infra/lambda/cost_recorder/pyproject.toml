[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge-cost-recorder"
version = "0.1.0"
description = "ModelForge cost-recorder Lambda: Batch job state change -> usage + cost"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
]
# modelforge-catalog and modelforge-db aren't on PyPI: install them editable alongside
# this package, e.g. `pip install -e packages/catalog -e packages/db -e infra/lambda/cost_recorder`.

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cost_recorder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
